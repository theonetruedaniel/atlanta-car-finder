[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanta-car-finder-scrapers"
version = "0.1.0"
description = "Cloud Scrapling inventory runner for the Atlanta Car Finder pilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "scrapling[fetchers]==0.3.14",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "PyYAML>=6,<7",
]

[project.scripts]
car-finder-scrapers = "car_finder_scrapers.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]


name: Daily inventory crawl

"on":
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-inventory-crawl
  cancel-in-progress: false

jobs:
  crawl-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out runner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Install Scrapling browsers
        run: scrapling install

      - name: Run fixture and unit tests
        run: python -m pytest -q

      - name: Request short-lived dashboard token
        id: dashboard-token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("atlanta-car-finder-ingestion");
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Crawl and upload sources sequentially
        run: car-finder-scrapers crawl all
        env:
          DASHBOARD_INGESTION_URL: https://dashboard.example.com/api/ingestion/scrapling
          SCRAPLING_INGESTION_SECRET: ${{ steps.dashboard-token.outputs.token }}

